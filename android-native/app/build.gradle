plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xzxg.shop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xzxg.shop'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'SHOW_TEST_SERVER_SETTINGS', 'true'
            buildConfigField 'String', 'DEFAULT_API_BASE', '"http://10.0.2.2:8080/api/v1"'
        }
        release {
            buildConfigField 'boolean', 'SHOW_TEST_SERVER_SETTINGS', 'false'
            buildConfigField 'String', 'DEFAULT_API_BASE', '"https://api.example.com/api/v1"'
            minifyEnabled false
        }
    }
}
